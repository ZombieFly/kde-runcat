name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install build dependencies
        run: |
          pacman --noconfirm -Syu
          pacman --noconfirm --needed -S \
            git \
            jq \
            kcmutils \
            kirigami \
            kitemmodels \
            kquickcharts \
            ksystemstats \
            libksysguard \
            libxml2 \
            make \
            plasma-workspace \
            qt6-declarative \
            zip

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify release version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(jq -r '.KPlugin.Version' package/metadata.json)"

          if [[ "$GITHUB_REF_NAME" != v* || "$tag_version" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

      - name: Build package
        run: make package

      - name: Generate checksum
        run: |
          cd build
          sha256sum com.github.runcatkde.runcat.plasmoid > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            build/com.github.runcatkde.runcat.plasmoid
            build/SHA256SUMS
